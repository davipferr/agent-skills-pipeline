# O FLUXO. Este arquivo é a única fonte da ordem das etapas.
#
# Cada etapa diz:
#   id          identificador único (kebab-case)
#   title       nome para humanos
#   skill       nome da skill que faz o trabalho (o `name:` do SKILL.md)
#   source      "local" (pasta skills/ deste repo) ou "owner/repo" do GitHub/skills.sh,
#               que precisa estar listado no skills.json
#   inputs      arquivos que a etapa lê (cada um tem que ser saída de uma etapa ANTERIOR)
#   outputs     arquivos que a etapa grava (cada arquivo tem um único dono)
#   interactive true se a etapa precisa de respostas do usuário
#   adapter     (opcional) instruções extras para encaixar uma skill externa,
#               que não conhece os arquivos deste projeto
#
# Depois de editar: `npm run validate` e `npm run diagram -- --write`.

name: ideia-ate-feature
description: Leva uma ideia solta até uma feature implementada com testes, revisada e documentada.

steps:
  - id: idea
    title: Capturar a ideia
    skill: capture-idea
    source: local
    inputs: []
    outputs: [docs/flow/01-ideia.md]
    interactive: true

  - id: grill
    title: Interrogatório
    skill: grilling
    source: mattpocock/skills
    inputs: [docs/flow/01-ideia.md]
    outputs: [docs/flow/02-decisoes.md]
    interactive: true
    adapter: adapters/grilling.md

  - id: prd
    title: PRD
    skill: write-prd
    source: local
    inputs: [docs/flow/01-ideia.md, docs/flow/02-decisoes.md]
    outputs: [docs/flow/03-prd.md]

  - id: architecture
    title: Arquitetura e fatias
    skill: plan-architecture
    source: local
    inputs: [docs/flow/03-prd.md]
    outputs: [docs/flow/04-arquitetura.md]

  - id: implement
    title: Implementação com TDD
    skill: tdd
    source: mattpocock/skills
    inputs: [docs/flow/03-prd.md, docs/flow/04-arquitetura.md]
    outputs: [docs/flow/05-implementacao.md]
    interactive: true
    adapter: adapters/tdd.md

  - id: review
    title: Revisão contra o PRD
    skill: review-against-prd
    source: local
    inputs: [docs/flow/03-prd.md, docs/flow/04-arquitetura.md, docs/flow/05-implementacao.md]
    outputs: [docs/flow/06-revisao.md]

  - id: ship
    title: Relatório de entrega
    skill: ship-report
    source: local
    inputs: [docs/flow/03-prd.md, docs/flow/06-revisao.md]
    outputs: [docs/flow/07-entrega.md]
